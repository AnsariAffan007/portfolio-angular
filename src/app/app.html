<main>

  <header class="border-b border-white/15 fixed top-0 h-[10vh] w-full">
    <nav class="flex items-center justify-between md:justify-normal h-full">

      <div class="w-1/3 flex items-center h-full ps-5 sm:ps-10">
        <a routerLink="/" class="h-full flex justify-center items-center">
          <img src="/AA_logo.png" alt="Affan Logo" class="h-1/2">
        </a>
      </div>

      <div
        class="w-1/3 hidden md:flex items-center justify-center md:gap-x-10 lg:gap-x-14 h-full border-white/15 border-l">
        <a routerLink="#" class="text-slate-400 hover:text-neon transition-colors duration-500 p-5 ">ABOUT</a>
        <a routerLink="#" class="text-slate-400 hover:text-neon transition-colors duration-500 p-5 ">WORK</a>
      </div>

      <div class="w-1/3 hidden lg:flex h-full">

        <div
          class="w-1/2 h-full flex items-center justify-center gap-x-6 border-white/15 border-l [&>a]:text-slate-400 [&>a]:hover:text-neon">
          <a href="#" class="p-5 text-lg rounded-full transition-colors">
            <fa-icon [icon]="faLinkedin"></fa-icon>
          </a>
          <a href="#" class="p-5 text-lg rounded-full transition-colors">
            <fa-icon [icon]="faGithub"></fa-icon>
          </a>
        </div>
        <div class="w-1/2 h-full flex items-center justify-center hover:[&>a]:text-neon border-l border-white/15">
          <a href="#" class="transition-colors duration-500 text-slate-400">CONTACT ME</a>
        </div>

      </div>

      <div class="w-1/3 h-full lg:hidden flex justify-center border-l border-white/15">
        <div class="flex gap-x-4">
          <span class="text-slate-400 my-auto">MENU</span>
          <span class="text-slate-400 my-auto"> <fa-icon [icon]="faBars"></fa-icon></span>
        </div>
      </div>

    </nav>
  </header>

  <div class="pt-[10vh]">
    <router-outlet />
  </div>
</main>
