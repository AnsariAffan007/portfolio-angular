<main>

  <!-- Dropdown menu -->
  <header
    class="w-[100vw] z-2 h-[90svh] absolute top-[10svh] left-0 transition-transform duration-700 ease-in-out bg-primary flex flex-col justify-center"
    [ngClass]="{'translate-y-[-100svh]': !menuOpen}">
    <nav class="text-center lg:hidden flex flex-col justify-center gap-y-20">
      <div class="text-slate-200 -mt-10 space-y-5">
        <h2 class="font-[900] text-4xl">ABOUT</h2>
        <h2 class="font-[900] text-4xl">WORK</h2>
        <h2 class="font-[900] text-4xl">CONTACT</h2>
      </div>
      <div class="text-slate-200 space-x-5">
        <a href="https://www.linkedin.com/in/affan-ansari-95b58b24a/" target="_blank"
          class="p-10 border bg-[#5bc0be33] border-[#5bc0be4d] rounded-[50%]">
          <fa-icon [icon]="faLinkedin"></fa-icon>
        </a>
        <a href="https://github.com/AnsariAffan007" target="_blank"
          class="p-10 border bg-[#5bc0be33] border-[#5bc0be4d] rounded-[50%]">
          <fa-icon [icon]="faGithub"></fa-icon>
        </a>
      </div>
    </nav>
  </header>

  <header class="border-b border-white/15 fixed top-0 h-[10vh] w-full z-3 bg-primary">
    <nav class="flex items-center justify-between md:justify-normal h-full">

      <div class="w-1/3 flex items-center h-full ps-5 sm:ps-10">
        <a routerLink="/" class="h-full flex justify-center items-center">
          <img src="/AA_logo.png" alt="Affan Logo" class="h-1/2">
        </a>
      </div>

      <div
        class="w-1/3 hidden md:flex items-center justify-center md:gap-x-10 lg:gap-x-14 h-full border-white/15 border-l">
        <a routerLink="#" class="text-slate-400 hover:text-neon transition-colors duration-500 p-5 ">ABOUT</a>
        <a routerLink="#" class="text-slate-400 hover:text-neon transition-colors duration-500 p-5 ">WORK</a>
      </div>

      <div class="w-1/3 hidden lg:flex h-full">

        <div
          class="w-1/2 h-full flex items-center justify-center gap-x-6 border-white/15 border-l [&>a]:text-slate-400 [&>a]:hover:text-neon">
          <a href="#" class="p-5 text-lg rounded-full transition-colors">
            <fa-icon [icon]="faLinkedin"></fa-icon>
          </a>
          <a href="#" class="p-5 text-lg rounded-full transition-colors">
            <fa-icon [icon]="faGithub"></fa-icon>
          </a>
        </div>
        <div class="w-1/2 h-full flex items-center justify-center hover:[&>a]:text-neon border-l border-white/15">
          <a href="#" class="transition-colors duration-500 text-slate-400">CONTACT ME</a>
        </div>

      </div>

      <div class="w-1/3 h-full lg:hidden flex justify-center border-l border-white/15" (click)="toggleMenu()">
        <div class="flex gap-x-4">
          <span class="my-auto transition-colors duration-500" [ngClass]="menuOpen ? 'text-neon' : 'text-slate-400'">
            MENU
          </span>
          <span class="my-auto transition-colors duration-500" [ngClass]="menuOpen ? 'text-neon' : 'text-slate-400'">
            <fa-icon [icon]="faBars"></fa-icon>
          </span>
        </div>
      </div>

    </nav>
  </header>

  <div class="pt-[10vh]">
    <router-outlet />
  </div>
</main>
